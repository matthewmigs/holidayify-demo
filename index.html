<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ember &amp; Wick — Holidayify demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* The store's own design. Like a real Shopify theme, it doesn't change with
     the holiday: Holidayify adds the banner and decorations on top. */
  :root {
    --paper: #FAF7F2;
    --ink: #2B2620;
    --olive: #6B7A52;
    --tan: #B08968;
    --line: #E3DCCB;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
  }

  h1, h2, .display {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  header.site {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 40px;
    border-bottom: 1px solid var(--line);
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    letter-spacing: -0.02em;
  }

  .wordmark em { font-style: italic; color: var(--olive); }

  nav.site a {
    color: var(--ink);
    text-decoration: none;
    font-size: 13px;
    margin-left: 28px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.75;
  }

  .hero {
    padding: 90px 40px 70px;
    max-width: 760px;
  }

  .hero .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--olive);
    font-weight: 600;
  }

  .hero h1 {
    font-size: 56px;
    line-height: 1.05;
    margin: 14px 0 20px;
  }

  .hero p {
    font-size: 17px;
    line-height: 1.6;
    max-width: 480px;
    opacity: 0.8;
  }

  .cta {
    display: inline-block;
    margin-top: 28px;
    padding: 13px 26px;
    background: var(--olive);
    color: var(--paper);
    border-radius: 3px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
  }

  .products {
    padding: 10px 40px 120px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
    max-width: 1080px;
  }

  .card {
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    background: rgba(255,255,255,0.4);
  }

  .card .swatch {
    height: 160px;
    background: linear-gradient(160deg, var(--tan), var(--olive));
  }

  .card .info { padding: 16px 18px 20px; }
  .card .info .name { font-family: 'Fraunces', serif; font-size: 16px; margin-bottom: 4px; }
  .card .info .price { font-size: 13px; opacity: 0.65; }

  /* ---- demo controls (not part of the merchant-facing app) ---- */
  #demo-dock {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: #201C17;
    border-radius: 999px;
    padding: 8px;
    display: flex;
    gap: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    z-index: 2147483600;
  }
  #demo-dock button {
    border: none;
    background: transparent;
    color: #EDE8DD;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0.65;
    transition: background .2s ease, opacity .2s ease;
    white-space: nowrap;
  }
  #demo-dock button:hover { opacity: 1; }
  #demo-dock button.active { background: #EDE8DD; color: #201C17; opacity: 1; font-weight: 600; }
  #demo-dock .sep { width: 1px; background: rgba(237,232,221,.2); margin: 6px 2px; }

  #demo-toast {
    position: fixed;
    left: 50%;
    bottom: 84px;
    transform: translateX(-50%);
    background: #201C17;
    color: #EDE8DD;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    z-index: 2147483600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    max-width: calc(100% - 32px);
    text-align: center;
  }
  #demo-toast.show { opacity: 1; }

  #phone-overlay {
    position: fixed;
    inset: 0;
    background: rgba(32,28,23,.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2147483640;
  }
  #phone-overlay.open { display: flex; }
  #phone-frame {
    width: 390px;
    height: min(780px, calc(100vh - 80px));
    border: 10px solid #201C17;
    border-radius: 36px;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  #phone-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  #phone-close {
    position: absolute;
    top: 16px;
    right: 20px;
    border: none;
    background: #EDE8DD;
    color: #201C17;
    font: 600 13px 'Inter', sans-serif;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
  }

  body.embedded #demo-dock, body.phone-open #demo-dock { display: none; }

  @media (max-width: 760px) {
    .products { grid-template-columns: 1fr; }
    .hero h1 { font-size: 38px; }
    header.site { padding: 18px 20px; }
    .hero { padding: 60px 20px 50px; }
    .products { padding: 10px 20px 160px; }
    /* One row that scrolls sideways, so it stays a single line on phones. */
    #demo-dock { flex-wrap: nowrap; justify-content: flex-start; width: calc(100% - 32px); bottom: 48px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    #demo-dock::-webkit-scrollbar { display: none; }
    #demo-dock button { flex: none; }
    #demo-dock .sep, #demo-dock .phone { display: none; }
    #demo-toast { bottom: 150px; }
  }
  @media (max-width: 480px) {
    nav.site a { margin-left: 14px; font-size: 12px; letter-spacing: 0.02em; }
    .wordmark { font-size: 18px; white-space: nowrap; }
  }
</style>
</head>
<body>

  <header class="site">
    <div class="wordmark">Ember &amp; <em>Wick</em></div>
    <nav class="site">
      <a href="#">Shop</a>
      <a href="#">Scents</a>
      <a href="#">About</a>
    </nav>
  </header>

  <section class="hero">
    <div class="eyebrow">Hand-poured, small batch</div>
    <h1>Candles made for<br/>slow evenings.</h1>
    <p>Every candle is poured in small batches with coconut wax and cotton wicks — clean burning, true to scent, made to last.</p>
    <a href="#" class="cta">Shop the collection</a>
  </section>

  <section class="products">
    <div class="card">
      <div class="swatch"></div>
      <div class="info">
        <div class="name">Fig &amp; Cedar</div>
        <div class="price">$28.00</div>
      </div>
    </div>
    <div class="card">
      <div class="swatch"></div>
      <div class="info">
        <div class="name">Amber Oak</div>
        <div class="price">$28.00</div>
      </div>
    </div>
    <div class="card">
      <div class="swatch"></div>
      <div class="info">
        <div class="name">Salt Air</div>
        <div class="price">$28.00</div>
      </div>
    </div>
  </section>

  <div id="demo-dock"></div>
  <div id="demo-toast" role="status" aria-live="polite"></div>
  <div id="phone-overlay" aria-hidden="true">
    <button id="phone-close" type="button">Close phone view</button>
    <div id="phone-frame"></div>
  </div>

  <!-- The real Holidayify storefront engine: a verbatim copy of the app's
       extensions/holidayify-embed/assets/holidayify.js. Update it by copying
       that file over this one; don't edit it here. -->
  <script src="holidayify.js"></script>

  <!-- ============================================================= -->
  <!-- Demo driver: feeds the engine the same settings a merchant's   -->
  <!-- store would get from the app, minus anything that talks to a   -->
  <!-- server. tracking is null, so no views or clicks are sent.      -->
  <!-- ============================================================= -->
  <script>
  (function () {
    const HOUR = 60 * 60 * 1000, DAY = 24 * HOUR;

    // The next time (local) a date comes round, e.g. nextDate(11, 30) = the
    // coming Nov 30 at 11:59pm, so countdowns never show as expired.
    function nextDate(month, day) {
      const now = new Date();
      let d = new Date(now.getFullYear(), month - 1, day, 23, 59);
      if (d <= now) d = new Date(now.getFullYear() + 1, month - 1, day, 23, 59);
      return d.toISOString();
    }

    // Same trick the app uses for "Preview on storefront": a schedule wide
    // enough that the chosen holiday is on today, whatever today is.
    function forceOn(packKey) {
      const pack = Holidayify.packs[packKey];
      const now = new Date();
      const base = Date.UTC(now.getUTCFullYear(), pack.end.month - 1, pack.end.day);
      const end = now.getTime() + 367 * DAY;
      return { activePacks: [packKey], bufferDays: 800, revertHour: Math.round((end - base) / HOUR) };
    }

    // What a merchant would set up on the app's Banners & offers page (the
    // shape the app sends to the storefront).
    const customBanners = {
      bfcm: "Black Friday: 20% off every candle",
      christmas: "Gift sets, wrapped and ready",
      valentines: "Candles for two",
      halloween: "Spooky season scents are back",
    };
    const ctas = {
      bfcm: { href: "/collections/sale", label: "Shop now", external: false, code: "BFCM20", codeMode: "show", deadline: "Ends Cyber Monday", countdownTo: nextDate(11, 30) },
      christmas: { href: "/collections/gifts", label: "Shop gifts", external: false, code: "GIFT15", codeMode: "show", deadline: "Order by Dec 18", countdownTo: nextDate(12, 18) },
      valentines: { href: "/collections/for-two", label: "Shop now", external: false, code: "LOVE10", codeMode: "show", deadline: null, countdownTo: nextDate(2, 14) },
      halloween: { href: "/collections/halloween", label: "Shop now", external: false, code: null, codeMode: "show", deadline: null, countdownTo: null },
    };

    const HOLIDAYS = [
      { key: "bfcm", label: "⚡ Black Friday" },
      { key: "christmas", label: "🎄 Christmas" },
      { key: "valentines", label: "💝 Valentine's" },
      { key: "halloween", label: "🎃 Halloween" },
      { key: null, label: "Everyday" },
    ];
    const DEFAULT = "bfcm";

    function show(key) {
      Holidayify.init(Object.assign(
        key ? forceOn(key) : { activePacks: [] },
        { customBanners, ctas, tracking: null, banner: true, decorations: true, credit: true, keepDecorations: false }
      ));
      current = key;
    }

    // Links in the banner go nowhere in the demo; say where they'd go.
    const toast = document.getElementById("demo-toast");
    let toastTimer = null;
    function say(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
    }
    document.addEventListener("click", (e) => {
      const link = e.target.closest && e.target.closest("#hf-banner a");
      if (!link) return;
      e.preventDefault();
      say("In a real store, this button opens " + link.getAttribute("href") + ".");
    }, true);

    const params = new URLSearchParams(location.search);
    const embedded = params.has("embedded");
    if (embedded) document.body.classList.add("embedded");
    const requested = params.get("holiday");
    let current = requested === "none" ? null : HOLIDAYS.some((h) => h.key && h.key === requested) ? requested : DEFAULT;

    // Holiday switcher.
    const dock = document.getElementById("demo-dock");
    const buttons = HOLIDAYS.map((h) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = h.label;
      btn.addEventListener("click", () => {
        show(h.key);
        buttons.forEach((b) => b.classList.toggle("active", b === btn));
        const url = new URL(location.href);
        url.searchParams.set("holiday", h.key || "none");
        history.replaceState(null, "", url);
      });
      dock.appendChild(btn);
      return btn;
    });
    const activeBtn = buttons[HOLIDAYS.findIndex((h) => h.key === current)];
    activeBtn.classList.add("active");
    // On phones the switcher scrolls sideways: bring the chosen holiday into view.
    dock.scrollLeft = Math.max(0, activeBtn.offsetLeft - 8);

    // Phone view: the same page in a 390px frame, so desktop visitors can see
    // the compact mobile banner.
    const sep = document.createElement("div");
    sep.className = "sep";
    dock.appendChild(sep);
    const phoneBtn = document.createElement("button");
    phoneBtn.type = "button";
    phoneBtn.className = "phone";
    phoneBtn.textContent = "📱 Phone view";
    dock.appendChild(phoneBtn);
    const overlay = document.getElementById("phone-overlay");
    const frame = document.getElementById("phone-frame");
    phoneBtn.addEventListener("click", () => {
      frame.innerHTML = "";
      const iframe = document.createElement("iframe");
      iframe.title = "Phone view";
      iframe.src = "?embedded=1&holiday=" + (current || "none");
      frame.appendChild(iframe);
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("phone-open");
    });
    const closePhone = () => {
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("phone-open");
      frame.innerHTML = "";
    };
    document.getElementById("phone-close").addEventListener("click", closePhone);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closePhone(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePhone(); });

    show(current);
  })();
  </script>

</body>
</html>
